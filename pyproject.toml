[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "we-learn-assistant"
version = "0.1.0"
description = "Modular learning assistant framework for WE Learn built with PySide6, Playwright, ADB, and SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "AmariS26242" }
]
dependencies = [
    "PySide6>=6.7.0",
    "playwright>=1.48.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
we-learn-assistant = "app.desktop.main:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "adapters*", "modules*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
